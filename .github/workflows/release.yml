name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-aarch64-musl-${{ hashFiles('**/Cargo.lock') }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Rename binary
        run: cp target/aarch64-unknown-linux-musl/release/claude-telegram claude-telegram-aarch64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: claude-telegram-aarch64
